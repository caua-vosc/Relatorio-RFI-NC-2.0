<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checklist Fotográfico</title>

<link rel="manifest" href="manifest.json">

<style>
:root{
    --primary:#0d6efd;
    --bg:#f5f7fa;
    --card:#ffffff;
    --text:#1f2933;
    --muted:#6b7280;
    --radius:14px;
}

*{box-sizing:border-box;}

body{
    margin:0;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
}

header{
    background:var(--card);
    padding:16px 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    position:sticky;
    top:0;
    z-index:10;
}

header h1{
    margin:0;
    font-size:20px;
    font-weight:600;
}

main{
    max-width:900px;
    margin:20px auto;
    padding:0 16px 80px;
}

.card{
    background:var(--card);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 4px 16px rgba(0,0,0,.05);
}

label{
    font-size:13px;
    color:var(--muted);
}

input[type="text"]{
    width:100%;
    padding:12px;
    margin-top:6px;
    border-radius:10px;
    border:1px solid #d1d5db;
    font-size:15px;
}

button{
    border:none;
    border-radius:12px;
    padding:14px;
    font-size:15px;
    cursor:pointer;
    transition:.2s;
}

.btn-primary{
    background:var(--primary);
    color:#fff;
}

.btn-secondary{
    background:#e5e7eb;
    color:#111827;
}

button:hover{
    opacity:.9;
}

.actions{
    display:flex;
    gap:12px;
    margin-top:12px;
}

section{
    margin-bottom:18px;
}

.edit-title{
    font-weight:600;
    border:none;
    background:#f1f5f9;
    border-radius:10px;
    padding:10px;
    width:100%;
    margin-bottom:10px;
}

input[type="file"]{
    width:100%;
    padding:10px;
    border:1px dashed #cbd5e1;
    border-radius:10px;
    background:#fafafa;
}

.img-container{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-top:10px;
}

.img-container img{
    width:90px;
    height:90px;
    object-fit:cover;
    border-radius:10px;
    border:1px solid #e5e7eb;
    cursor:pointer;
}

.contador{
    width:100%;
    font-size:12px;
    color:var(--muted);
}

footer{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    padding:12px 16px;
    background:var(--card);
    box-shadow:0 -2px 10px rgba(0,0,0,.08);
}
</style>
</head>

<body>

<header>
    <h1>Checklist Fotográfico</h1>
</header>

<main>

    <div class="card">
        <label>ID do Site (obrigatório)</label>
        <input type="text" id="siteId" placeholder="Ex: SITE_123" />

        <div class="actions">
            <button class="btn-secondary" onclick="toggleAdmin()">Modo Administrador</button>
        </div>
    </div>

    <div id="checklistContainer"></div>

</main>

<footer>
    <button class="btn-primary" style="width:100%" onclick="enviarRelatorio()">
        Enviar Relatório para OneDrive
    </button>
</footer>

<script src="https://alcdn.msauth.net/browser/2.38.0/js/msal-browser.min.js"></script>
<script src="db.js"></script>
<script src="onedrive.js"></script>
<script src="app.js"></script>

<script>
if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
