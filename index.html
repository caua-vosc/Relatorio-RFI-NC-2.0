<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist Fotográfico</title>

<link rel="manifest" href="manifest.json">

<style>
:root{
    --primary:#0d6efd;
    --bg:#f5f7fa;
    --card:#ffffff;
    --text:#1f2933;
    --muted:#6b7280;
    --radius:14px;
}
*{box-sizing:border-box;}
body{
    margin:0;
    font-family:Segoe UI, Roboto, Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
}
header{
    background:var(--card);
    padding:16px 20px;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    position:sticky;
    top:0;
}
header h1{margin:0;font-size:20px;font-weight:600;}
main{max-width:900px;margin:20px auto;padding:0 16px 120px;}
.card{
    background:var(--card);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:16px;
    box-shadow:0 4px 16px rgba(0,0,0,.05);
}
label{font-size:13px;color:var(--muted);}
input[type="text"]{
    width:100%;
    padding:12px;
    margin-top:6px;
    border-radius:10px;
    border:1px solid #d1d5db;
}
button{
    border:none;
    border-radius:12px;
    padding:12px;
    font-size:14px;
    cursor:pointer;
}
.btn-primary{background:#0d6efd;color:#fff;}
.btn-secondary{background:#e5e7eb;}
.btn-danger{background:#dc3545;color:#fff;}
.edit-title{
    font-weight:600;
    border:none;
    background:#f1f5f9;
    border-radius:10px;
    padding:10px;
    width:100%;
    margin-bottom:8px;
}
input[type="file"]{
    width:100%;
    padding:10px;
    border:1px dashed #cbd5e1;
    border-radius:10px;
}
.img-container{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;}
.img-container img{
    width:90px;height:90px;object-fit:cover;
    border-radius:10px;border:1px solid #e5e7eb;
}
.contador{font-size:12px;color:#6b7280;width:100%;}
.admin-tools{
    display:flex;
    gap:8px;
    margin-bottom:10px;
}
footer{
    position:fixed;bottom:0;left:0;right:0;
    padding:12px 16px;background:#fff;
    box-shadow:0 -2px 10px rgba(0,0,0,.08);
}
</style>
</head>

<body>

<header>
    <h1>Checklist Fotográfico</h1>
</header>

<main>

    <div class="card">
        <label>ID do Site</label>
        <input type="text" id="siteId" placeholder="Ex: SITE_123">

        <br><br>
        <button class="btn-secondary" onclick="toggleAdmin()">Modo Administrador</button>
        <button class="btn-primary" onclick="criarSecao()" style="display:none" id="btnNovaSecao">
            + Nova Seção
        </button>
    </div>

    <div id="checklistContainer"></div>

</main>

<footer>
    <button class="btn-primary" style="width:100%" onclick="enviarRelatorio()">
        Enviar Relatório
    </button>
</footer>

<script src="db.js"></script>
<script src="upload.js"></script>
<script src="app.js"></script>

<script>
if("serviceWorker" in navigator){
    navigator.serviceWorker.register("service-worker.js");
}
</script>

</body>
</html>
